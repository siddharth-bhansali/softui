name: Publish to npm

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs BEFORE setup-node so no placeholder auth token is in .npmrc.
      # Compares against the registry (not HEAD~1), so multi-commit pushes,
      # retries and manual runs all publish an unpublished version.
      - name: Compare local version with npm registry
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          set +e
          OUT=$(npm view "$NAME@$LOCAL" version --registry=https://registry.npmjs.org 2>&1)
          CODE=$?
          set -e
          if [ $CODE -eq 0 ] && [ "$OUT" = "$LOCAL" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$LOCAL already on npm; skipping."
          elif echo "$OUT" | grep -q "E404"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$LOCAL not on npm; will publish."
          else
            echo "Unexpected npm view result (exit $CODE):"; echo "$OUT"; exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.publish == 'true'
        with:
          bun-version: 1.3.14

      - name: Install (locked)
        if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      # prepublishOnly runs build:min, so there is no separate build step.
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
